# Configuration comes from environment variables. For local development, put them in a .env file
# next to this project (copy .env.example to .env). Real environment variables always win over .env.
server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: diary-api
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast so an unavailable Redis never slows requests down (the cache is optional).
      timeout: 500ms
      connect-timeout: 500ms
  cache:
    type: ${CACHE_TYPE:redis}     # set CACHE_TYPE=none to disable caching entirely
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/diary}
    username: ${SPRING_DATASOURCE_USERNAME:diary}
    password: ${SPRING_DATASOURCE_PASSWORD:diary}
    hikari:
      # Give up quickly when PostgreSQL is unreachable, so health checks answer 503 instead of hanging.
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /actuator/health/readiness
      show-details: never
      group:
        # Readiness depends on PostgreSQL only: Redis is a cache, so the API keeps serving without it.
        # /actuator/health (all components) still reports DOWN when Redis is unreachable.
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: MyDiary API
    version: 1.0.0

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
  cache:
    stats-ttl: ${CACHE_STATS_TTL:10m}
    entry-ttl: ${CACHE_ENTRY_TTL:30m}
