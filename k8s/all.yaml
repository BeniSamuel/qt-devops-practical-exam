apiVersion: v1
kind: Namespace
metadata:
  name: qt-go-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mydiary-config
  namespace: qt-go-app
data:
  POSTGRES_DB: diary
  POSTGRES_USER: diary
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SPRING_CACHE_TYPE: redis
  CACHE_TYPE: redis
  SEED_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: http://192.168.160.205:30080,http://192.168.160.206:30080,http://192.168.160.207:30080
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-postgres
  local:
    path: /var/lib/qt-mydiary/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [c2-k8s-master]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: qt-go-app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-postgres
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: qt-go-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      nodeSelector: {kubernetes.io/hostname: c2-k8s-master}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: mydiary-config, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {configMapKeyRef: {name: mydiary-config, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: mydiary-secrets, key: POSTGRES_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 250m, memory: 512Mi}
          readinessProbe: {exec: {command: [sh, -c, 'pg_isready -U diary -d diary']}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {exec: {command: [sh, -c, 'pg_isready -U diary -d diary']}, initialDelaySeconds: 30, periodSeconds: 20}
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: qt-go-app}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: qt-go-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: [sh, -c]
          args: ['exec redis-server --appendonly no --requirepass "$REDIS_PASSWORD"']
          env: [{name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: mydiary-secrets, key: REDIS_PASSWORD}}}]
          ports: [{containerPort: 6379}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          readinessProbe: {exec: {command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {exec: {command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']}, initialDelaySeconds: 15, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: qt-go-app}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: qt-go-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: backend
          image: benisamuel/mydiary-backend:exam-c4-v2
          ports: [{containerPort: 8080}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres:5432/diary}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {configMapKeyRef: {name: mydiary-config, key: POSTGRES_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: mydiary-secrets, key: POSTGRES_PASSWORD}}}
            - {name: REDIS_HOST, valueFrom: {configMapKeyRef: {name: mydiary-config, key: REDIS_HOST}}}
            - {name: REDIS_PORT, valueFrom: {configMapKeyRef: {name: mydiary-config, key: REDIS_PORT}}}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: mydiary-secrets, key: REDIS_PASSWORD}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: mydiary-secrets, key: JWT_SECRET}}}
            - {name: CACHE_TYPE, valueFrom: {configMapKeyRef: {name: mydiary-config, key: CACHE_TYPE}}}
            - {name: SEED_ENABLED, valueFrom: {configMapKeyRef: {name: mydiary-config, key: SEED_ENABLED}}}
            - {name: CORS_ALLOWED_ORIGINS, valueFrom: {configMapKeyRef: {name: mydiary-config, key: CORS_ALLOWED_ORIGINS}}}
            - {name: JAVA_TOOL_OPTIONS, value: -Xms128m -Xmx384m}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: 500m, memory: 768Mi}}
          readinessProbe: {httpGet: {path: /api/health, port: 8080}, initialDelaySeconds: 180, periodSeconds: 10, failureThreshold: 18}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 240, periodSeconds: 20, failureThreshold: 6}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: qt-go-app}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: qt-go-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: benisamuel/mydiary-frontend:exam-c4-v1
          ports: [{containerPort: 3000}]
          env: [{name: HOSTNAME, value: 0.0.0.0}, {name: PORT, value: "3000"}]
          resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 300m, memory: 512Mi}}
          readinessProbe: {httpGet: {path: /, port: 3000}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: 3000}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: qt-go-app}
spec:
  selector: {app: frontend}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: nginx-config, namespace: qt-go-app}
data:
  default.conf: |
    server {
      listen 80;
      location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
      location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nginx, namespace: qt-go-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: nginx}}
  template:
    metadata: {labels: {app: nginx}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 15, periodSeconds: 20}
      volumes: [{name: config, configMap: {name: nginx-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: nginx, namespace: qt-go-app}
spec:
  type: NodePort
  selector: {app: nginx}
  ports: [{name: http, port: 80, targetPort: 80, nodePort: 30080}]
